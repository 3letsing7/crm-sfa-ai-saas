<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeilleureVieSales — CRM/SFA + 受発注・決済 プロトタイプ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;height:100vh;overflow:hidden}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f4f0;
  --text-primary:#1a1a1a;--text-secondary:#5f5e5a;--text-tertiary:#888780;
  --border-tertiary:rgba(0,0,0,0.12);--border-secondary:rgba(0,0,0,0.22);
  --radius-md:8px;--radius-lg:12px;
}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--bg-secondary);border-right:0.5px solid var(--border-tertiary);display:flex;flex-direction:column;padding:12px 0;overflow-y:auto}
.sidebar-logo{padding:0 14px 14px;font-size:11px;font-weight:500;color:var(--text-primary);display:flex;align-items:center;gap:7px;letter-spacing:-0.01em}
.sidebar-logo i{font-size:17px;color:#534AB7;flex-shrink:0}
.nav-section{font-size:10px;color:var(--text-tertiary);padding:0 14px 5px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:background .1s}
.nav-item:hover{background:var(--bg-primary);color:var(--text-primary)}
.nav-item.active{background:var(--bg-primary);color:#534AB7;font-weight:500}
.nav-item.active i{color:#534AB7}
.nav-item i{font-size:15px;flex-shrink:0}
.nav-sep{height:1px;background:var(--border-tertiary);margin:8px 0}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{height:44px;border-bottom:0.5px solid var(--border-tertiary);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;background:var(--bg-primary)}
.topbar-title{font-size:14px;font-weight:500;color:var(--text-primary)}
.topbar-right{display:flex;align-items:center;gap:10px}
.avatar{width:26px;height:26px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#534AB7}
.content{flex:1;overflow-y:auto;padding:16px;background:var(--bg-secondary)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi-card{background:var(--bg-primary);border-radius:var(--radius-md);padding:12px 14px;border:0.5px solid var(--border-tertiary)}
.kpi-label{font-size:11px;color:var(--text-secondary);margin-bottom:5px}
.kpi-value{font-size:20px;font-weight:500;color:var(--text-primary)}
.kpi-sub{font-size:11px;margin-top:3px}
.kpi-up{color:#0F6E56}.kpi-down{color:#993C1D}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.st{font-size:13px;font-weight:500;color:var(--text-primary)}
.btn-sm{font-size:11px;padding:4px 10px;background:transparent;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer}
.btn-sm:hover{background:var(--bg-secondary)}
.btn-p{background:#534AB7;color:#fff;font-size:11px;padding:4px 12px;border-radius:var(--radius-md);cursor:pointer;border:none}
.btn-p:hover{background:#3C3489}
.btn-g{background:#1D9E75;color:#fff;font-size:11px;padding:4px 12px;border-radius:var(--radius-md);cursor:pointer;border:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:var(--bg-primary);border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);padding:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 7px;font-size:10px;font-weight:500;color:var(--text-tertiary);border-bottom:0.5px solid var(--border-tertiary);text-transform:uppercase;letter-spacing:.04em}
td{padding:7px 7px;border-bottom:0.5px solid var(--border-tertiary);color:var(--text-primary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-secondary)}
input,select,textarea{border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#534AB7}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500}
.b-new{background:#E1F5EE;color:#0F6E56}
.b-prop{background:#EEEDFE;color:#3C3489}
.b-nego{background:#FAEEDA;color:#854F0B}
.b-won{background:#EAF3DE;color:#3B6D11}
.b-lost{background:#FCEBEB;color:#A32D2D}
.b-paid{background:#EAF3DE;color:#3B6D11}
.b-unpaid{background:#FCEBEB;color:#A32D2D}
.b-partial{background:#FAEEDA;color:#854F0B}
.b-pending{background:#EEEDFE;color:#3C3489}
.pipe-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pipe-label{font-size:11px;color:var(--text-secondary);width:58px;flex-shrink:0}
.pipe-bg{flex:1;height:5px;background:var(--bg-secondary);border-radius:4px;overflow:hidden}
.pipe-fill{height:5px;border-radius:4px}
.pipe-count{font-size:11px;color:var(--text-tertiary);width:22px;text-align:right}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:0.5px solid var(--border-tertiary)}
.sum-row:last-child{border-bottom:none;font-weight:500;font-size:13px;color:var(--text-primary)}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <i class="ti ti-building-skyscraper"></i>MeilleureVieSales
    </div>
    <div class="nav-section">CRM / SFA</div>
    <div class="nav-item active" onclick="show('dashboard')"><i class="ti ti-layout-dashboard"></i>ダッシュボード</div>
    <div class="nav-item" onclick="show('customers')"><i class="ti ti-building"></i>顧客管理</div>
    <div class="nav-item" onclick="show('deals')"><i class="ti ti-trending-up"></i>商談管理</div>
    <div class="nav-item" onclick="show('tasks')"><i class="ti ti-checkbox"></i>タスク管理</div>
    <div class="nav-item" onclick="show('ai')"><i class="ti ti-sparkles"></i>AI営業支援（AI機能）</div>
    <div class="nav-sep"></div>
    <div class="nav-section">受発注</div>
    <div class="nav-item" onclick="show('invoices')"><i class="ti ti-file-invoice"></i>請求書管理</div>
    <div class="nav-item" onclick="show('orders')"><i class="ti ti-shopping-cart"></i>受注管理</div>
    <div class="nav-item" onclick="show('purchases')"><i class="ti ti-package"></i>発注・仕入管理</div>
    <div class="nav-sep"></div>
    <div class="nav-section">決済・債権債務</div>
    <div class="nav-item" onclick="show('payments')"><i class="ti ti-cash"></i>入金管理</div>
    <div class="nav-item" onclick="show('expenses')"><i class="ti ti-credit-card"></i>支払管理</div>
    <div class="nav-item" onclick="show('checkout')"><i class="ti ti-device-mobile-payment"></i>決済画面（顧客向け）</div>
    <div class="nav-sep"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="page-title">ダッシュボード</span>
      <div class="topbar-right">
        <i class="ti ti-bell" style="font-size:17px;color:var(--text-secondary)"></i>
        <div class="avatar">YM</div>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>

<script>
const pages = {

dashboard:{title:'ダッシュボード',render(){return`
  <div class="kpi-grid">
    ${[['売上見込（今月）','¥38.4M','前月比 +12%',true],['未収入金','¥12.6M','3件未消込',false],['進行中商談','24件','先週比 +3',true],['未払費用','¥4.2M','今月期限',false]].map(([l,v,s,up])=>`
      <div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div>
      <div class="kpi-sub ${up?'kpi-up':'kpi-down'}"><i class="ti ti-arrow-${up?'up':'down'}-right" style="font-size:10px"></i> ${s}</div></div>`).join('')}
  </div>
  <div class="two-col" style="margin-bottom:14px">
    <div class="card">
      <div class="sh"><span class="st">商談パイプライン</span><button class="btn-sm" onclick="show('deals')">詳細 →</button></div>
      ${[['新規接触',8,'#534AB7'],['提案中',5,'#EF9F27'],['交渉中',3,'#D85A30'],['成約',2,'#639922']].map(([l,n,c])=>`
        <div class="pipe-row"><div class="pipe-label">${l}</div><div class="pipe-bg"><div class="pipe-fill" style="width:${n*10}%;background:${c}"></div></div><div class="pipe-count">${n}</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="sh"><span class="st">入金状況</span><button class="btn-sm" onclick="show('payments')">詳細 →</button></div>
      ${[['株式会社テクノ','¥5,200,000','消込済','b-paid'],['フューチャーIT','¥3,800,000','未消込','b-unpaid'],['グローバルSys','¥2,100,000','一部消込','b-partial'],['デジタルコア','¥1,500,000','未消込','b-unpaid']].map(([co,amt,status,cls])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--border-tertiary)">
          <span style="font-size:12px">${co}</span>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px">${amt}</span><span class="badge ${cls}">${status}</span></div>
        </div>`).join('')}
    </div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="sh"><span class="st">直近の受注</span><button class="btn-sm" onclick="show('orders')">詳細 →</button></div>
      ${[['INV-2026-042','テクノ・ソリューションズ','¥5.2M'],['INV-2026-041','フューチャーIT','¥3.8M'],['INV-2026-040','グローバルSys','¥2.1M']].map(([no,co,amt])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--border-tertiary)">
          <div><div style="font-size:12px;font-weight:500">${no}</div><div style="font-size:10px;color:var(--text-tertiary)">${co}</div></div>
          <span style="font-size:12px">${amt}</span>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="sh"><span class="st">今週の支払予定</span><button class="btn-sm" onclick="show('expenses')">詳細 →</button></div>
      ${[['AWS（クラウド費用）','¥320,000','06/28'],['Stripe手数料','¥85,000','06/30'],['外注費（デザイン）','¥550,000','07/02']].map(([name,amt,due])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--border-tertiary)">
          <div><div style="font-size:12px">${name}</div><div style="font-size:10px;color:var(--text-tertiary)">期限 ${due}</div></div>
          <span style="font-size:12px;font-weight:500">${amt}</span>
        </div>`).join('')}
    </div>
  </div>`}},

customers:{title:'顧客管理',render(){return`
  <div class="sh">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" placeholder="会社名・担当者を検索..." style="width:200px;font-size:12px;padding:4px 9px">
      <select style="font-size:12px;padding:4px 7px"><option>すべて</option><option>IT企業</option><option>SaaS</option></select>
    </div>
    <button class="btn-p"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> 顧客追加</button>
  </div>
  <div class="card" style="padding:0">
    <table><thead><tr><th>会社名</th><th>担当者</th><th>業種</th><th>ステータス</th><th>売上累計</th><th>最終活動</th></tr></thead>
    <tbody>${[['株式会社テクノ・ソリューションズ','山田 太郎','SaaS','取引中','¥18.4M','3日前'],['フューチャーIT株式会社','鈴木 花子','ITコンサル','取引中','¥12.1M','1週間前'],['グローバルシステムズ','佐藤 一郎','SI','見込み','¥0','2週間前'],['デジタルコア株式会社','田中 美咲','SaaS','取引中','¥5.2M','昨日'],['ネクストテック株式会社','伊藤 健太','クラウド','リード','¥0','今日']].map(([name,person,industry,status,sales,last])=>`
      <tr style="cursor:pointer">
        <td style="font-weight:500">${name}</td><td>${person}</td><td style="color:var(--text-secondary)">${industry}</td>
        <td><span class="badge ${status==='取引中'?'b-won':status==='見込み'?'b-prop':'b-new'}">${status}</span></td>
        <td style="font-weight:500">${sales}</td><td style="color:var(--text-secondary)">${last}</td>
      </tr>`).join('')}</tbody></table></div>`}},

deals:{title:'商談管理',render(){return`
  <div class="sh">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" placeholder="商談名・顧客を検索..." style="width:200px;font-size:12px;padding:4px 9px">
      <select style="font-size:12px;padding:4px 7px"><option>すべてのステータス</option><option>提案中</option><option>交渉中</option></select>
    </div>
    <button class="btn-p"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> 商談追加</button>
  </div>
  <div class="card" style="padding:0">
    <table><thead><tr><th>商談名</th><th>顧客</th><th>担当</th><th>金額</th><th>ステータス</th><th>期日</th></tr></thead>
    <tbody>${[['CRM導入支援','テクノ・ソリューションズ','山田','¥5,200,000','交渉中','06/30'],['クラウド移行PJ','フューチャーIT','鈴木','¥18,000,000','提案中','07/15'],['データ分析基盤','グローバルシステムズ','佐藤','¥12,000,000','提案中','08/01'],['セキュリティ監査','デジタルコア','田中','¥3,500,000','新規接触','08/31'],['AI開発支援','ネクストテック','伊藤','¥25,000,000','提案中','09/30']].map(([deal,co,person,amt,status,date])=>`
      <tr><td style="font-weight:500">${deal}</td><td style="color:var(--text-secondary)">${co}</td><td style="color:var(--text-secondary)">${person}</td>
      <td>${amt}</td><td><span class="badge ${status==='交渉中'?'b-nego':status==='提案中'?'b-prop':'b-new'}">${status}</span></td>
      <td style="color:var(--text-secondary)">${date}</td></tr>`).join('')}</tbody></table></div>`}},

tasks:{title:'タスク管理',render(){return`
  <div class="sh"><span class="st">今週のタスク</span><button class="btn-p"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> タスク追加</button></div>
  <div class="card" style="padding:0">
    <table><thead><tr><th style="width:28px"></th><th>タスク</th><th>関連顧客</th><th>期限</th><th>優先度</th></tr></thead>
    <tbody>${[[true,'提案書の最終確認','テクノ・ソリューションズ','今日','高'],[false,'フォローアップメール送付','フューチャーIT','明日','中'],[false,'請求書INV-041の確認','フューチャーIT','6/28','高'],[true,'契約書レビュー依頼','デジタルコア','6/29','低'],[false,'入金消込処理','グローバルSys','6/30','中']].map(([done,task,co,due,pri])=>`
      <tr><td><i class="ti ${done?'ti-circle-check':'ti-circle'}" style="font-size:15px;color:${done?'#1D9E75':'var(--text-tertiary)'}"></i></td>
      <td style="${done?'text-decoration:line-through;color:var(--text-tertiary)':''}">${task}</td>
      <td style="color:var(--text-secondary)">${co}</td>
      <td style="color:${due==='今日'?'#993C1D':'var(--text-secondary)'};font-weight:${due==='今日'?'500':'400'}">${due}</td>
      <td><span class="badge ${pri==='高'?'b-lost':pri==='中'?'b-nego':'b-new'}">${pri}</span></td></tr>`).join('')}</tbody></table></div>`}},

invoices:{title:'請求書管理（インボイス対応）',render(){return`
  <div class="sh">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" placeholder="請求書番号・顧客を検索..." style="width:200px;font-size:12px;padding:4px 9px">
      <select style="font-size:12px;padding:4px 7px"><option>すべて</option><option>未払い</option><option>消込済</option></select>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn-sm"><i class="ti ti-download" style="font-size:12px;vertical-align:-1px"></i> CSV</button>
      <button class="btn-sm" onclick="show('checkout')"><i class="ti ti-link" style="font-size:12px;vertical-align:-1px"></i> 決済リンク送付</button>
      <button class="btn-p"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> 請求書作成</button>
    </div>
  </div>
  <div class="card" style="padding:0;margin-bottom:14px">
    <table><thead><tr><th>請求書番号</th><th>顧客</th><th>発行日</th><th>支払期限</th><th>税抜金額</th><th>消費税</th><th>合計</th><th>ステータス</th><th></th></tr></thead>
    <tbody>${[['INV-2026-042','テクノ・ソリューションズ','06/01','06/30','¥4,727,272','¥472,728（10%）','¥5,200,000','b-paid','消込済'],['INV-2026-041','フューチャーIT','06/05','07/05','¥3,454,545','¥345,455（10%）','¥3,800,000','b-unpaid','未払い'],['INV-2026-040','グローバルSys','05/20','06/20','¥1,909,090','¥190,910（10%）','¥2,100,000','b-partial','一部消込'],['INV-2026-039','デジタルコア','05/15','06/15','¥1,363,636','¥136,364（10%）','¥1,500,000','b-unpaid','未払い']].map(([no,co,issued,due,net,tax,total,cls,status])=>`
      <tr style="cursor:pointer">
        <td style="font-weight:500;color:#534AB7">${no}</td><td>${co}</td>
        <td style="color:var(--text-secondary)">${issued}</td><td style="color:var(--text-secondary)">${due}</td>
        <td>${net}</td><td style="color:var(--text-secondary);font-size:11px">${tax}</td>
        <td style="font-weight:500">${total}</td>
        <td><span class="badge ${cls}">${status}</span></td>
        <td><i class="ti ti-download" style="font-size:13px;color:var(--text-tertiary)"></i></td>
      </tr>`).join('')}</tbody></table>
  </div>
  <div class="card" style="background:var(--bg-secondary)">
    <div style="font-size:11px;font-weight:500;color:var(--text-secondary);margin-bottom:8px">インボイス登録番号：T1234567890123　（適格請求書発行事業者）</div>
    <div style="display:flex;gap:24px">
      ${[['請求総額','¥12,600,000'],['消込済','¥5,200,000'],['未収入金','¥7,400,000']].map(([l,v])=>`
        <div><div style="font-size:11px;color:var(--text-secondary)">${l}</div><div style="font-size:16px;font-weight:500">${v}</div></div>`).join('')}
    </div>
  </div>`}},

orders:{title:'受注管理',render(){return`
  <div class="sh">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" placeholder="受注番号・顧客を検索..." style="width:200px;font-size:12px;padding:4px 9px">
      <select style="font-size:12px;padding:4px 7px"><option>すべて</option><option>受注確定</option><option>納品済</option></select>
    </div>
    <button class="btn-p"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> 受注登録</button>
  </div>

      <div id="coupon-msg" style="font-size:10px;display:none;margin-bottom:6px"></div>

      <div style="height:0.5px;background:var(--border-tertiary);margin-bottom:8px"></div>

      <!-- 金額内訳 -->
      <div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:var(--text-secondary)"><span>小計（税抜）</span><span>¥3,454,545</span></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:var(--text-secondary)"><span>消費税（10%）</span><span>¥345,455</span></div>
      <div id="discount-row" style="display:none;justify-content:space-between;font-size:11px;padding:3px 0;color:#0F6E56"><span>割引</span><span id="discount-amt"></span></div>
      <div style="height:0.5px;background:var(--border-tertiary);margin:8px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--text-primary);padding:3px 0"><span>合計</span><span>¥3,800,000</span></div>
      <div style="font-size:10px;color:var(--text-tertiary);margin-top:2px">¥345,455 の消費税（10%）を含む</div>

      <!-- インボイス情報 -->
      <div style="background:#EEEDFE;border:0.5px solid #AFA9EC;border-radius:var(--radius-md);padding:8px 10px;font-size:10px;color:#3C3489;margin-top:14px;line-height:1.7">
        <div style="font-weight:500;margin-bottom:3px"><i class="ti ti-circle-check" style="font-size:11px"></i> 適格請求書（インボイス）対応</div>
        <div>登録番号：T1234567890123</div>
        <div>取引内容：クラウド移行PJサービス</div>
        <div>税率：10% ／ 消費税額：¥345,455</div>
        <div style="margin-top:3px;color:#534AB7">支払い完了後に適格請求書PDFを発行します。</div>
      </div>

      <!-- ルート①の説明 -->
      <div style="margin-top:12px;font-size:10px;color:var(--text-tertiary);line-height:1.6">
        <i class="ti ti-info-circle" style="font-size:11px;vertical-align:-1px"></i>
        この画面は<strong style="color:var(--text-secondary)">請求書管理</strong>の「決済リンク送付」から遷移します（ルート①）。
        支払い完了後、入金管理画面で自動消込処理が行われます。
      </div>
    </div>
  </div>

  <script>
  function selPay(type){
    ['card','pp','bank'].forEach(t=>{
      document.getElementById('opt-'+t).style.background='';
      const f=document.getElementById(t===\'card\'?\'card-fields\':t+\'-fields\');
      if(f) f.style.display=\'none\';
    });
    document.getElementById(\'opt-\'+type).style.background=\'#EEEDFE\';
    const fields=document.getElementById(type===\'card\'?\'card-fields\':type+\'-fields\');
    if(fields) fields.style.display=\'block\';
    document.querySelectorAll(\'[name=pay]\')[{card:0,pp:1,bank:2}[type]].checked=true;
  }
  function applyCoupon(){
    const code=document.getElementById(\'coupon\').value.trim();
    const msg=document.getElementById(\'coupon-msg\');
    const row=document.getElementById(\'discount-row\');
    msg.style.display=\'block\';
    if(code.toUpperCase()===\'SALES10\'){
      msg.style.color=\'#0F6E56\'; msg.textContent=\'クーポン適用：10%割引\';
      row.style.display=\'flex\';
      document.getElementById(\'discount-amt\').textContent=\'−¥380,000\';
    } else if(!code){
      msg.style.color=\'#993C1D\'; msg.textContent=\'コードを入力してください\';
      row.style.display=\'none\';
    } else {
      msg.style.color=\'#993C1D\'; msg.textContent=\'このクーポンコードは無効です\';
      row.style.display=\'none\';
    }
  }
  function doPay(){
    const btn=document.getElementById(\'pay-btn\');
    btn.innerHTML=\'処理中...\'; btn.disabled=true; btn.style.opacity=\'0.7\';
    setTimeout(()=>{
      btn.innerHTML=\'<i class="ti ti-circle-check"></i> 支払い完了 — 領収書を送信しました\';
      btn.style.background=\'#1D9E75\'; btn.style.opacity=\'1\';
    },1800);
  }
  <\/script>
`}},

function show(id){
  const page=pages[id]||pages.dashboard;
  document.getElementById('page-title').textContent=page.title;
  document.getElementById('page-content').innerHTML=page.render();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const map={dashboard:0,customers:1,deals:2,tasks:3,ai:4,invoices:5,orders:6,purchases:7,payments:8,expenses:9,checkout:10};
  const items=document.querySelectorAll('.nav-item');
  if(map[id]!==undefined) items[map[id]]?.classList.add('active');
}
show('dashboard');
</script>
