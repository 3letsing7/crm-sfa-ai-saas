<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesAI — CRM/SFA プロトタイプ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f5f4f0;
  --bg-info:#e6f1fb;
  --text-primary:#1a1a1a;
  --text-secondary:#5f5e5a;
  --text-tertiary:#888780;
  --border-tertiary:rgba(0,0,0,0.12);
  --border-secondary:rgba(0,0,0,0.22);
  --radius-md:8px;
  --radius-lg:12px;
}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:var(--bg-secondary);border-right:0.5px solid var(--border-tertiary);display:flex;flex-direction:column;padding:16px 0}
.sidebar-logo{padding:0 16px 20px;font-size:15px;font-weight:500;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.sidebar-logo i{font-size:20px;color:#534AB7}
.nav-section{font-size:11px;color:var(--text-tertiary);padding:0 16px 6px;text-transform:uppercase;letter-spacing:.05em}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:background .1s}
.nav-item:hover{background:var(--bg-primary);color:var(--text-primary)}
.nav-item.active{background:var(--bg-primary);color:#534AB7;font-weight:500}
.nav-item.active i{color:#534AB7}
.nav-item i{font-size:16px}
.nav-sep{height:1px;background:var(--border-tertiary);margin:12px 0}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:48px;border-bottom:0.5px solid var(--border-tertiary);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;background:var(--bg-primary)}
.topbar-title{font-size:15px;font-weight:500}
.topbar-right{display:flex;align-items:center;gap:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#534AB7}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--bg-secondary)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--bg-primary);border-radius:var(--radius-md);padding:14px 16px;border:0.5px solid var(--border-tertiary)}
.kpi-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:500}
.kpi-sub{font-size:12px;margin-top:4px}
.kpi-up{color:#0F6E56}
.kpi-down{color:#993C1D}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:14px;font-weight:500}
.btn-sm{font-size:12px;padding:5px 12px;background:transparent;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer}
.btn-sm:hover{background:var(--bg-secondary)}
.btn-primary{background:#534AB7;color:#fff;font-size:12px;padding:5px 14px;border-radius:var(--radius-md);cursor:pointer;border:none}
.btn-primary:hover{background:#3C3489}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--bg-primary);border:0.5px solid var(--border-tertiary);border-radius:var(--radius-lg);padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 8px;font-size:11px;font-weight:500;color:var(--text-tertiary);border-bottom:0.5px solid var(--border-tertiary);text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 8px;border-bottom:0.5px solid var(--border-tertiary);color:var(--text-primary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-secondary)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.badge-new{background:#E1F5EE;color:#0F6E56}
.badge-proposal{background:#EEEDFE;color:#3C3489}
.badge-nego{background:#FAEEDA;color:#854F0B}
.badge-won{background:#EAF3DE;color:#3B6D11}
.badge-lost{background:#FCEBEB;color:#A32D2D}
.pipe-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pipe-label{font-size:12px;color:var(--text-secondary);width:64px;flex-shrink:0}
.pipe-bg{flex:1;height:6px;background:var(--bg-secondary);border-radius:4px;overflow:hidden}
.pipe-fill{height:6px;border-radius:4px}
.pipe-count{font-size:12px;color:var(--text-tertiary);width:24px;text-align:right}
.activity-item{display:flex;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border-tertiary)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.activity-body{flex:1}
.activity-title{font-size:13px}
.activity-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border-tertiary);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px}
.tab.active{color:#534AB7;border-bottom-color:#534AB7;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <i class="ti ti-building-skyscraper"></i>SalesAI
    </div>
    <div class="nav-section">メイン</div>
    <div class="nav-item active" onclick="showPage('dashboard')"><i class="ti ti-layout-dashboard"></i>ダッシュボード</div>
    <div class="nav-item" onclick="showPage('customers')"><i class="ti ti-building"></i>顧客管理</div>
    <div class="nav-item" onclick="showPage('deals')"><i class="ti ti-brand-office"></i>商談管理</div>
    <div class="nav-item" onclick="showPage('tasks')"><i class="ti ti-checkbox"></i>タスク管理</div>
    <div class="nav-sep"></div>
    <div class="nav-section">AI機能</div>
    <div class="nav-item" onclick="showPage('ai')"><i class="ti ti-sparkles"></i>AI提案書生成</div>
    <div class="nav-item" onclick="showPage('ai')"><i class="ti ti-mail"></i>AI営業メール</div>
  </div>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="page-title">ダッシュボード</span>
      <div class="topbar-right">
        <i class="ti ti-bell" style="font-size:18px;color:var(--text-secondary)"></i>
        <div class="avatar">YM</div>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>
<script>
const pages={
  dashboard:{title:'ダッシュボード',render(){return`
    <div class="kpi-grid">
      ${[['今月の売上見込','¥38.4M','前月比 +12%',true],['進行中の商談','24件','先週比 +3',true],['成約率','32%','前月比 -4%',false],['管理顧客数','158社','今月 +6社',true]].map(([l,v,s,up])=>`
        <div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div>
        <div class="kpi-sub ${up?'kpi-up':'kpi-down'}"><i class="ti ti-arrow-${up?'up':'down'}-right" style="font-size:11px"></i> ${s}</div></div>`).join('')}
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-header"><span class="section-title">商談パイプライン</span><button class="btn-sm" onclick="showPage('deals')">詳細 →</button></div>
        ${[['新規接触',8,'#534AB7'],['ヒアリング',6,'#1D9E75'],['提案中',5,'#EF9F27'],['交渉中',3,'#D85A30'],['成約',2,'#639922']].map(([l,n,c])=>`
          <div class="pipe-row"><div class="pipe-label">${l}</div><div class="pipe-bg"><div class="pipe-fill" style="width:${n*10}%;background:${c}"></div></div><div class="pipe-count">${n}</div></div>`).join('')}
      </div>
      <div class="card">
        <div class="section-header"><span class="section-title">直近の活動</span></div>
        ${[['ti-phone','#EEEDFE','#534AB7','株式会社テクノ・ソリューションズ','電話フォロー完了','10分前'],['ti-mail','#E1F5EE','#0F6E56','フューチャーIT株式会社','提案メール送付','1時間前'],['ti-calendar','#FAEEDA','#854F0B','グローバルシステムズ','商談アポ確定','3時間前'],['ti-file-text','#FCEBEB','#993C1D','デジタルコア株式会社','提案書作成中','昨日']].map(([icon,bg,color,name,act,time])=>`
          <div class="activity-item"><div class="activity-icon" style="background:${bg}"><i class="ti ${icon}" style="color:${color}"></i></div>
          <div class="activity-body"><div class="activity-title">${act}</div><div class="activity-meta">${name} · ${time}</div></div></div>`).join('')}
      </div>
    </div>`}},
  customers:{title:'顧客管理',render(){return`
    <div class="section-header">
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" placeholder="会社名・担当者を検索..." style="width:220px;font-size:13px;padding:5px 10px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)">
        <select style="font-size:13px;padding:5px 8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)"><option>すべて</option><option>IT企業</option><option>SaaS</option></select>
      </div>
      <button class="btn-primary"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> 顧客追加</button>
    </div>
    <div class="card" style="padding:0">
      <table><thead><tr><th>会社名</th><th>担当者</th><th>業種</th><th>ステータス</th><th>最終活動</th><th></th></tr></thead>
      <tbody>${[['株式会社テクノ・ソリューションズ','山田 太郎','SaaS','active','3日前'],['フューチャーIT株式会社','鈴木 花子','ITコンサル','active','1週間前'],['グローバルシステムズ','佐藤 一郎','SI','prospect','2週間前'],['デジタルコア株式会社','田中 美咲','SaaS','active','昨日'],['ネクストテック株式会社','伊藤 健太','クラウド','lead','今日']].map(([name,person,industry,status,last])=>`
        <tr style="cursor:pointer" onclick="showPage('customer_detail')">
          <td style="font-weight:500">${name}</td><td>${person}</td><td style="color:var(--text-secondary)">${industry}</td>
          <td><span class="badge ${status==='active'?'badge-won':status==='prospect'?'badge-proposal':'badge-new'}">${status==='active'?'取引中':status==='prospect'?'見込み':'リード'}</span></td>
          <td style="color:var(--text-secondary)">${last}</td><td><i class="ti ti-chevron-right" style="color:var(--text-tertiary);font-size:14px"></i></td>
        </tr>`).join('')}</tbody></table></div>`}},
  customer_detail:{title:'顧客詳細',render(){return`
    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px">
      <div>
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
            <div style="width:40px;height:40px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;color:#534AB7">テ</div>
            <div><div style="font-size:14px;font-weight:500">株式会社テクノ・<br>ソリューションズ</div></div>
          </div>
          <div style="font-size:12px;border-top:0.5px solid var(--border-tertiary);padding-top:12px">
            ${[['ti-user','担当者','山田 太郎'],['ti-mail','メール','yamada@techno.co.jp'],['ti-phone','電話','03-1234-5678'],['ti-map-pin','所在地','東京都千代田区'],['ti-users','従業員数','250名']].map(([icon,label,val])=>`
              <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
                <i class="ti ${icon}" style="font-size:14px;color:var(--text-tertiary);margin-top:1px"></i>
                <div><div style="color:var(--text-tertiary)">${label}</div><div>${val}</div></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card"><div style="font-size:13px;font-weight:500;margin-bottom:10px">メモ</div>
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.6">DX推進に積極的。来期予算あり。CTO佐々木氏がキーマン。</div></div>
      </div>
      <div>
        <div class="tab-bar"><div class="tab active">商談履歴</div><div class="tab">活動履歴</div><div class="tab">タスク</div></div>
        <div class="section-header"><span class="section-title">商談一覧</span><button class="btn-primary"><i class="ti ti-plus" style="font-size:12px;vertical-align:-1px"></i> 商談追加</button></div>
        <div class="card" style="padding:0"><table><thead><tr><th>商談名</th><th>金額</th><th>ステータス</th><th>期日</th></tr></thead>
          <tbody>${[['CRM導入支援','¥5,200,000','交渉中','2026/06/30'],['データ分析基盤','¥12,000,000','提案中','2026/07/31']].map(([name,amt,status,date])=>`
            <tr><td style="font-weight:500">${name}</td><td>${amt}</td>
            <td><span class="badge ${status==='交渉中'?'badge-nego':'badge-proposal'}">${status}</span></td>
            <td style="color:var(--text-secondary)">${date}</td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>`}},
  deals:{title:'商談管理',render(){return`
    <div class="section-header">
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" placeholder="商談名・顧客を検索..." style="width:220px;font-size:13px;padding:5px 10px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)">
        <select style="font-size:13px;padding:5px 8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)"><option>すべてのステータス</option><option>新規接触</option><option>提案中</option><option>交渉中</option></select>
      </div>
      <button class="btn-primary"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> 商談追加</button>
    </div>
    <div class="card" style="padding:0"><table><thead><tr><th>商談名</th><th>顧客</th><th>担当</th><th>金額</th><th>ステータス</th><th>期日</th></tr></thead>
      <tbody>${[['CRM導入支援','テクノ・ソリューションズ','山田','¥5,200,000','交渉中','06/30'],['クラウド移行PJ','フューチャーIT','鈴木','¥18,000,000','提案中','07/15'],['データ分析基盤','グローバルシステムズ','佐藤','¥12,000,000','ヒアリング','08/01'],['セキュリティ監査','デジタルコア','田中','¥3,500,000','新規接触','08/31'],['AI開発支援','ネクストテック','伊藤','¥25,000,000','提案中','09/30']].map(([deal,co,person,amt,status,date])=>`
        <tr><td style="font-weight:500">${deal}</td><td style="color:var(--text-secondary)">${co}</td><td style="color:var(--text-secondary)">${person}</td>
        <td>${amt}</td><td><span class="badge ${status==='交渉中'?'badge-nego':status==='提案中'?'badge-proposal':status==='新規接触'?'badge-new':'badge-won'}">${status}</span></td>
        <td style="color:var(--text-secondary)">${date}</td></tr>`).join('')}</tbody></table></div>`}},
  tasks:{title:'タスク管理',render(){return`
    <div class="section-header"><span class="section-title">今週のタスク</span><button class="btn-primary"><i class="ti ti-plus" style="font-size:13px;vertical-align:-1px"></i> タスク追加</button></div>
    <div class="card" style="padding:0"><table><thead><tr><th style="width:32px"></th><th>タスク</th><th>関連顧客</th><th>期限</th><th>優先度</th></tr></thead>
      <tbody>${[[true,'提案書の最終確認','テクノ・ソリューションズ','今日','高'],[false,'フォローアップメール送付','フューチャーIT','明日','中'],[false,'デモ環境の準備','グローバルシステムズ','5/24','高'],[true,'契約書レビュー依頼','デジタルコア','5/25','低'],[false,'要件ヒアリング日程調整','ネクストテック','5/27','中']].map(([done,task,co,due,pri])=>`
        <tr><td><i class="ti ${done?'ti-circle-check':'ti-circle'}" style="font-size:16px;color:${done?'#1D9E75':'var(--text-tertiary)'}"></i></td>
        <td style="${done?'text-decoration:line-through;color:var(--text-tertiary)':''}">${task}</td>
        <td style="color:var(--text-secondary)">${co}</td>
        <td style="color:${due==='今日'?'#993C1D':'var(--text-secondary)'};font-weight:${due==='今日'?'500':'400'}">${due}</td>
        <td><span class="badge ${pri==='高'?'badge-lost':pri==='中'?'badge-nego':'badge-new'}">${pri}</span></td></tr>`).join('')}</tbody></table></div>`}},
  ai:{title:'AI営業支援',render(){return`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      ${[['ti-file-text','AI提案書生成','顧客情報・商談内容からカスタム提案書を自動生成'],['ti-mail','AI営業メール','状況に応じた最適なアプローチメールを生成'],['ti-notes','AI商談要約','商談メモをAIが整理・要約'],['ti-chart-dots','AI顧客分析','顧客データから購買傾向・チャンスを分析']].map(([icon,title,desc])=>`
        <div class="card" style="opacity:.7">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <i class="ti ${icon}" style="font-size:22px;color:#534AB7"></i>
            <span style="font-size:14px;font-weight:500">${title}</span>
            <span class="badge badge-proposal" style="margin-left:auto;font-size:10px">Phase 2</span>
          </div>
          <div style="font-size:13px;color:var(--text-secondary)">${desc}</div>
        </div>`).join('')}
    </div>
    <div class="card" style="border:0.5px solid #AFA9EC">
      <div style="font-size:13px;font-weight:500;color:#3C3489;margin-bottom:12px"><i class="ti ti-sparkles" style="font-size:14px;vertical-align:-2px"></i> AI提案書生成（デモ）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">対象顧客</div>
          <select style="width:100%;font-size:13px;padding:6px 8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)"><option>株式会社テクノ・ソリューションズ</option></select></div>
        <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">商談</div>
          <select style="width:100%;font-size:13px;padding:6px 8px;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary)"><option>CRM導入支援</option></select></div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">追加メモ・要望</div>
        <textarea style="width:100%;font-size:13px;padding:8px;height:72px;resize:none;border:0.5px solid var(--border-secondary);border-radius:var(--radius-md);background:var(--bg-secondary);color:var(--text-primary)" placeholder="例：ROI重視、競合はSalesforce、意思決定者はCTO..."></textarea>
      </div>
      <button class="btn-primary"><i class="ti ti-sparkles" style="font-size:12px;vertical-align:-1px"></i> 提案書を生成する</button>
    </div>`}}
};
function showPage(id){
  const page=pages[id]||pages.dashboard;
  document.getElementById('page-title').textContent=page.title;
  document.getElementById('page-content').innerHTML=page.render();
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const map={dashboard:0,customers:1,customer_detail:1,deals:2,tasks:3,ai:4};
  const items=document.querySelectorAll('.nav-item');
  if(map[id]!==undefined)items[map[id]]?.classList.add('active');
}
showPage('dashboard');
</script>
</body>
</html>
